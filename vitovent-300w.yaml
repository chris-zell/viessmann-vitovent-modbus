# ============================================================
# VITOVENT 300-W (H32E) — Modbus RTU via Tail485 on M5Stack AtomS3 Lite (PORT.A)
# Register map: https://github.com/chris-zell/viessmann-vitovent-modbus
# Bus: 19200 baud, 8E1, slave 70, X15 (pin 1 = B-, pin 2 = A+, pin 3 = GND)
# ============================================================

substitutions:
  name: vitovent-300w
  friendly_name: "Vitovent 300-W"
  # Tail485 on AtomS3 Lite via PORT.A (same pins as the Heidelberg reference config)
  modbus_tx_pin: GPIO02
  modbus_rx_pin: GPIO01
  modbus_baud_rate: "19200"
  modbus_slave_id: "70"
  timezone: "Europe/Berlin"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  min_version: 2024.11.0

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 8MB
  framework:
    type: esp-idf

# USB-CDC logging: baud_rate 0 avoids a clash with GPIO1/2
logger:
  level: INFO
  baud_rate: 0
  logs:
    modbus_controller: INFO

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "Vitovent Fallback"
    password: !secret fallback_password

captive_portal:

uart:
  - id: uart_modbus_rtu
    tx_pin: ${modbus_tx_pin}
    rx_pin: ${modbus_rx_pin}
    baud_rate: ${modbus_baud_rate}
    parity: EVEN
    data_bits: 8
    stop_bits: 1

modbus:
  id: modbus_rtu
  uart_id: uart_modbus_rtu

modbus_controller:
  - id: vitovent
    address: ${modbus_slave_id}
    modbus_id: modbus_rtu
    command_throttle: 100ms
    update_interval: 10s
    offline_skip_updates: 3

# Shared filter: the unit reports 32768 (0x8000) for "not available". Drop those readings.
# Used as YAML anchor below.
.na_filter: &na_filter
  - lambda: |-
      if (x >= 32768) return {};
      return x;

sensor:
  # ---- Live airflow and fans ----
  - platform: modbus_controller
    modbus_controller_id: vitovent
    id: vent_stage_actual
    name: "Lüftungsstufe Ist"
    address: 1009
    register_type: holding
    value_type: U_WORD
    filters: *na_filter

  - platform: modbus_controller
    modbus_controller_id: vitovent
    id: vent_supply_flow
    name: "Zuluft Volumenstrom"
    address: 1010
    register_type: holding
    value_type: U_WORD
    unit_of_measurement: "m³/h"
    accuracy_decimals: 0
    state_class: measurement
    filters: *na_filter

  - platform: modbus_controller
    modbus_controller_id: vitovent
    id: vent_supply_rpm
    name: "Zuluft Ventilator"
    address: 1011
    register_type: holding
    value_type: U_WORD
    unit_of_measurement: "rpm"
    state_class: measurement
    filters: *na_filter

  - platform: modbus_controller
    modbus_controller_id: vitovent
    id: vent_extract_flow
    name: "Abluft Volumenstrom"
    address: 1013
    register_type: holding
    value_type: U_WORD
    unit_of_measurement: "m³/h"
    accuracy_decimals: 0
    state_class: measurement
    filters: *na_filter

  - platform: modbus_controller
    modbus_controller_id: vitovent
    id: vent_extract_rpm
    name: "Abluft Ventilator"
    address: 1014
    register_type: holding
    value_type: U_WORD
    unit_of_measurement: "rpm"
    state_class: measurement
    filters: *na_filter

  # ---- Temperatures (0.1 °C, signed). Sensor-to-location mapping: verify on your unit ----
  - platform: modbus_controller
    modbus_controller_id: vitovent
    id: vent_temp_1
    name: "Temperatur Sensor 1"
    address: 1020
    register_type: holding
    value_type: S_WORD
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    filters:
      - multiply: 0.1
      - lambda: |-
          if (x >= 3276.8 || x <= -3276.8) return {};
          return x;

  - platform: modbus_controller
    modbus_controller_id: vitovent
    id: vent_temp_2
    name: "Temperatur Sensor 2"
    address: 1023
    register_type: holding
    value_type: S_WORD
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    filters:
      - multiply: 0.1
      - lambda: |-
          if (x >= 3276.8 || x <= -3276.8) return {};
          return x;

  - platform: modbus_controller
    modbus_controller_id: vitovent
    id: vent_temp_3
    name: "Temperatur Sensor 3"
    address: 1025
    register_type: holding
    value_type: S_WORD
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    filters:
      - multiply: 0.1
      - lambda: |-
          if (x >= 3276.8 || x <= -3276.8) return {};
          return x;

  # ---- Humidity ----
  - platform: modbus_controller
    modbus_controller_id: vitovent
    id: vent_humidity_1
    name: "Feuchte Sensor 1"
    address: 1031
    register_type: holding
    value_type: U_WORD
    unit_of_measurement: "%"
    device_class: humidity
    state_class: measurement
    filters: *na_filter

  - platform: modbus_controller
    modbus_controller_id: vitovent
    id: vent_humidity_2
    name: "Feuchte Sensor 2"
    address: 1032
    register_type: holding
    value_type: U_WORD
    unit_of_measurement: "%"
    device_class: humidity
    state_class: measurement
    filters: *na_filter

  # ---- Bypass feedback ----
  - platform: modbus_controller
    modbus_controller_id: vitovent
    id: vent_bypass_position
    name: "Bypass Klappenstellung"
    address: 1128
    register_type: holding
    value_type: U_WORD
    state_class: measurement
    filters: *na_filter

  # ---- Operating hours ----
  - platform: modbus_controller
    modbus_controller_id: vitovent
    id: vent_operating_hours
    name: "Betriebsstunden"
    address: 2000
    register_type: holding
    value_type: U_WORD
    unit_of_measurement: "h"
    device_class: duration
    state_class: total_increasing
    filters: *na_filter

  # ---- Uptime of the bridge itself ----
  - platform: uptime
    name: "Bridge Laufzeit"
    unit_of_measurement: min
    accuracy_decimals: 0
    filters:
      - multiply: 0.016666667
    update_interval: 60s
    disabled_by_default: true

  - platform: wifi_signal
    name: "WLAN Signal"
    update_interval: 60s
    entity_category: diagnostic

# ---- Lüftungsstufe schreiben (Register 2002) ----
# Stufen 1–4 = Volumenstrom-Presets, 5 = Intensiv (max. Förderung)
select:
  - platform: modbus_controller
    modbus_controller_id: vitovent
    id: vent_stage_target
    name: "Lüftungsstufe Soll"
    address: 2002
    value_type: U_WORD
    optionsmap:
      "Stufe 1": 1
      "Stufe 2": 2
      "Stufe 3": 3
      "Stufe 4": 4
      "Intensiv": 5

  # ---- Bypass-Modus (Register 6006). Achtung: Werte-Reihenfolge wie im Gerät ----
  - platform: modbus_controller
    modbus_controller_id: vitovent
    id: vent_bypass_mode
    name: "Bypass Modus"
    address: 6006
    value_type: U_WORD
    entity_category: config
    optionsmap:
      "Automatik": 0
      "Offen erzwingen": 1
      "Geschlossen erzwingen": 2

text_sensor:
  - platform: wifi_info
    ip_address:
      name: "IP-Adresse"
      entity_category: diagnostic
